<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0B1A" />
    <meta
      name="description"
      content="Free PDF and image tools that run entirely in your browser. Your files never leave your device."
    />
    <title>Privacy Toolkit</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('pt-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.dataset.theme = t;
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FAF8FF');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
